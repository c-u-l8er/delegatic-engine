app = "delegatic-mcp"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  MIX_ENV = "prod"
  DELEGATIC_TRANSPORT = "http"
  DELEGATIC_PORT = "4400"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 4400
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
